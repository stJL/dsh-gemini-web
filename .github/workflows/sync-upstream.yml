name: Upstream Sync

on:
  schedule:
    - cron: '0 3 * * 1' # 每周一凌晨 3:00 自动检查上游更新
  workflow_dispatch:   # 允许在 GitHub 网页上手动点击一键触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Upstream Sync Script
        run: |
          python scripts/sync_upstream.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: sync upstream gemini-web-agent scripts"
          title: "🤖 [Automated] 同步上游 gemini-web-agent 最新选择器与脚本"
          body: |
            检测到上游 [@582835293/gemini-web-agent](https://github.com/582835293/gemini-web-agent) 有更新。
            已自动拉取并保留 DSH 专有补丁与设置特性。
          branch: auto-sync-upstream
          base: main
